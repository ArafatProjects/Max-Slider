name: Compile Haxe to SWF

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krzysztof-cieslak/setup-haxe@v2
        with:
          haxe-version: '4.3.0'

      - name: Install Haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install openfl
          haxelib install lime

      - name: Build SWF Target
        run: |
          lime test flash -final

      - name: Upload SWF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: banner-swf
          path: bin
