name: Compile Haxe to SWF

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Haxe and Dependencies via APT
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe libneko-dev
          haxelib setup --always ~/haxelib

      - name: Install OpenFL and Lime
        run: |
          haxelib install openfl --quiet
          haxelib install lime --quiet
          haxelib run lime setup -y

      - name: Build SWF Target
        run: |
          lime test flash -final

      - name: Upload SWF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: banner-swf
          path: bin/
