name: Compile Haxe to SWF

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: haxefoundation/setup-haxe@v2
        with:
          haxe-version: '4.3.3'

      - name: Configure Haxelib and Install Dependencies
        run: |
          haxelib setup --always ~/haxelib
          haxelib install openfl --quiet
          haxelib install lime --quiet
          haxelib run lime setup -y

      - name: Build Flash SWF
        run: |
          lime build flash -final

      - name: Upload SWF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: banner-swf
          path: bin/flash/bin/*.swf
